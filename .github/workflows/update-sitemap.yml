name: Update SEO sitemap
on:
  push:
    branches: [main]
    paths:
      - 'reports.json'
      - 'studies/**/index.html'
      - 'perspectives/**/index.html'
      - 'scripts/generate_sitemap.py'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_sitemap.py
      - name: Commit sitemap changes
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Update sitemap for published research"
            git push
          fi
