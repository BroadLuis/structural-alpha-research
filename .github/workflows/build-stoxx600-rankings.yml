name: Build STOXX 600 rankings from original Excel

on:
  push:
    paths:
      - "studies/2026-10-09-stoxx600/assets/*.xlsx"
      - "scripts/build_stoxx600_rankings.py"
      - ".github/workflows/build-stoxx600-rankings.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-stoxx600-rankings
  cancel-in-progress: false

jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build complete rankings from Excel
        run: python3 scripts/build_stoxx600_rankings.py
      - name: Commit internal ranking data
        run: |
          git add studies/2026-10-09-stoxx600/companies.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh 500 STOXX 600 rankings from original Excel"
            git push
          fi
