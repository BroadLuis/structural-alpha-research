name: Update study view counts

on:
  push:
    paths:
      - ".github/workflows/update-study-views.yml"
      - "scripts/update_views.py"
      - "reports.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-study-views
  cancel-in-progress: false

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh read-only page-view snapshots
        run: python3 scripts/update_views.py
      - name: Publish snapshot if changed
        run: |
          if ! git diff --quiet -- views.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add views.json
            git commit -m "Refresh published study visit counts"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo "Unable to publish refreshed counts after retries" >&2
            exit 1
          fi
